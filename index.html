<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Служба ремонта</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }
    h2 {
      text-align: center;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      box-sizing: border-box;
    }
    button {
      background-color: #e0e0e0;
      color: blue;
      border: none;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
    }
  </style>
</head>
<body>
  <h2>СЛУЖБА МЕЛКОГО БЫТОВОГО РЕМОНТА</h2>

  <label for="service">Выберите услугу :</label>
  <select id="service">
    <option value="">-- Выберите --</option>
    <option value="Сантехника">Сантехника</option>
    <option value="Электрика">Электрика</option>
    <option value="Сборка мебели">Сборка мебели</option>
    <option value="Мелкий ремонт">Мелкий ремонт</option>
  </select>

  <label for="description">Опишите проблему :</label>
  <textarea id="description" rows="4" placeholder="Например, протекает кран..."></textarea>

  <label for="contact">Ваш Телефон, WhatsApp или Telegram :</label>
  <input type="text" id="contact" placeholder="+7..." />

  <button id="submitBtn" disabled>Отправить заявку</button>

  <script>
    const tg = window.Telegram.WebApp;
    const service = document.getElementById('service');
    const description = document.getElementById('description');
    const contact = document.getElementById('contact');
    const btn = document.getElementById('submitBtn');

    function checkForm() {
      btn.disabled = !(service.value && description.value && contact.value);
    }

    [service, description, contact].forEach(el => el.addEventListener('input', checkForm));

    btn.addEventListener('click', () => {
      const data = {
        service: service.value,
        description: description.value,
        contact: contact.value,
      };

      // Отправим данные в Telegram боту
      tg.sendData(JSON.stringify(data));
      tg.close();
    });

    tg.expand(); // Открывает мини-приложение на весь экран
  </script>
</body>
</html>
